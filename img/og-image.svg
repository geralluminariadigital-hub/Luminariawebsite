<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Fundo escuro -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0D1829"/>
      <stop offset="100%" stop-color="#05060E"/>
    </radialGradient>
    <!-- Clarão central azul -->
    <radialGradient id="glowCore" cx="50%" cy="44%" r="30%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#5B82F5" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#2D5BE3" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2D5BE3" stop-opacity="0"/>
    </radialGradient>
    <!-- Aura exterior -->
    <radialGradient id="glowOuter" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#2D5BE3" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#1A3FB0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#05060E" stop-opacity="0"/>
    </radialGradient>
    <!-- Raio vertical -->
    <linearGradient id="rayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="62%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Filtro glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Partículas filter -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Aura exterior -->
  <ellipse cx="600" cy="275" rx="660" ry="380" fill="url(#glowOuter)"/>

  <!-- Clarão central -->
  <ellipse cx="600" cy="275" rx="360" ry="240" fill="url(#glowCore)"/>

  <!-- Raio vertical -->
  <ellipse cx="600" cy="315" rx="36" ry="310" fill="url(#rayGrad)"/>

  <!-- Partículas/estrelas -->
  <g filter="url(#starGlow)" opacity="0.7">
    <circle cx="480" cy="180" r="1.8" fill="#A0C4FF"/>
    <circle cx="720" cy="160" r="1.4" fill="#FFFFFF"/>
    <circle cx="390" cy="290" r="1.2" fill="#7BA7FF"/>
    <circle cx="820" cy="240" r="1.6" fill="#FFFFFF"/>
    <circle cx="540" cy="140" r="1.0" fill="#A0C4FF"/>
    <circle cx="670" cy="130" r="1.3" fill="#FFFFFF"/>
    <circle cx="440" cy="350" r="1.1" fill="#7BA7FF"/>
    <circle cx="760" cy="330" r="1.4" fill="#FFFFFF"/>
    <circle cx="350" cy="220" r="1.0" fill="#A0C4FF"/>
    <circle cx="860" cy="180" r="1.2" fill="#FFFFFF"/>
    <circle cx="510" cy="390" r="1.3" fill="#7BA7FF"/>
    <circle cx="700" cy="380" r="1.0" fill="#FFFFFF"/>
    <circle cx="280" cy="300" r="0.9" fill="#A0C4FF"/>
    <circle cx="920" cy="290" r="1.1" fill="#FFFFFF"/>
    <circle cx="620" cy="420" r="0.8" fill="#7BA7FF"/>
    <circle cx="580" cy="110" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="460" cy="450" r="0.7" fill="#A0C4FF" opacity="0.5"/>
    <circle cx="780" cy="420" r="0.9" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Linha separadora fina -->
  <line x1="500" y1="310" x2="700" y2="310" stroke="rgba(91,130,245,0.35)" stroke-width="0.8"/>

  <!-- LUMINÁRIA — título principal -->
  <text
    x="600" y="290"
    font-family="Arial Black, Arial, sans-serif"
    font-size="108"
    font-weight="900"
    letter-spacing="18"
    text-anchor="middle"
    fill="#FFFFFF"
    filter="url(#textGlow)"
  >LUMINÁRIA</text>

  <!-- Slogan -->
  <text
    x="600" y="348"
    font-family="Arial, sans-serif"
    font-size="22"
    font-weight="300"
    letter-spacing="3"
    text-anchor="middle"
    fill="rgba(255,255,255,0.70)"
  >Dê luz ao seu negócio.</text>

  <!-- Sub-slogan -->
  <text
    x="600" y="382"
    font-family="Arial, sans-serif"
    font-size="14"
    font-weight="300"
    letter-spacing="2"
    text-anchor="middle"
    fill="rgba(255,255,255,0.38)"
  >Criação e gestão de websites · Lisboa, Portugal</text>

  <!-- Domínio no fundo -->
  <text
    x="600" y="590"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="2.5"
    text-anchor="middle"
    fill="rgba(91,130,245,0.50)"
  >luminariadigital.pt</text>
</svg>
